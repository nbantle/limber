<!doctype html><meta charset="utf-8"><title>Frames</title>
<!-- Each exercise sampled at s evenly spaced times. Params: ids=a,b | from=0&n=10, s=6, w=190, h=150 -->
<link rel="stylesheet" href="../styles.css">
<style>body{background:#fff;color:#000;margin:4px;min-height:0;font:13px sans-serif}.row{display:flex;gap:3px;margin-bottom:6px;align-items:center}.row b{width:110px;font-size:12px;word-break:break-all}.c{width:var(--w,190px);height:var(--h,150px);background:#f1f5f9}</style>
<div id=g></div>
<script type=module>
import {EXERCISES} from '../js/exercises.js'; import {renderFigure, makeRig} from '../js/figure.js';
const qp=new URLSearchParams(location.search); const ids=(qp.get('ids')||'').split(',').filter(Boolean);
const from=+(qp.get('from')||0), n=+(qp.get('n')||999), S=+(qp.get('s')||6);
const list=ids.length?EXERCISES.filter(e=>ids.includes(e.id)):EXERCISES.slice(from,from+n);
const g=document.getElementById("g");const W=+(qp.get("w")||190),H=+(qp.get("h")||150);document.body.style.setProperty("--w",W+"px");document.body.style.setProperty("--h",H+"px");
for(const ex of list){const r=document.createElement('div');r.className='row';r.innerHTML=`<b>${ex.id}</b>`;g.append(r);
 const cyc=makeRig(ex.anim).cycle; for(let i=0;i<S;i++){const c=document.createElement('div');c.className='c';r.append(c);renderFigure(c,ex,{time:cyc*i/S,aspect:W/H});}}
document.title='ready';
</script>
